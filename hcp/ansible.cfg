## Ansible reads ansible.cfg from the CURRENT WORKING DIRECTORY, not from the
## playbook's directory. Running the playbooks from inside hcp/ therefore
## does not pick up the repository root's ansible.cfg, so it is mirrored here -
## the same arrangement as ceph/ansible.cfg and compact-cluster/ansible.cfg.
##
## Keep the [defaults] below in step with ../ansible.cfg.
[defaults]
host_key_auto_add = True

## The hosted-cluster playbooks use roles that stay in the shared roles/
## directory: setup-bminfra, create-hosted-cluster, setup-sushy-emulator, plus
## the task files they include from setup-hub-cluster-disconnected.
##
## Ansible searches ./roles/ next to the playbook, but not further up; this
## adds the repository's shared roles/ directory, and keeps the three system
## defaults that naming roles_path would otherwise replace.
##
## Relative to the WORKING DIRECTORY, which is why the documented way to run
## these playbooks is `cd hcp` first.
roles_path = ../roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
