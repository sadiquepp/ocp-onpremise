---
# Checks that change nothing. Every failure names the step that fixes it.

- name: Check the management cluster's kubeconfig exists
  ansible.builtin.stat:
    path: "{{ kubevirt_mgmt_kubeconfig }}"
  register: kubevirt_kubeconfig_stat

- name: Fail if it does not
  ansible.builtin.assert:
    that:
      - kubevirt_kubeconfig_stat.stat.exists
    fail_msg: >-
      {{ kubevirt_mgmt_kubeconfig }} not found. Build the hub first
      (setup_hub_cluster.yaml), or point kubevirt_mgmt_kubeconfig at the
      management cluster you mean to use.

- name: Check the hosted-cluster and MetalLB APIs are there
  ansible.builtin.command:
    cmd: oc get crd {{ item }}
  loop:
    - hostedclusters.hypershift.openshift.io
    - ipaddresspools.metallb.io
  register: kubevirt_crds
  changed_when: false
  failed_when: false

- name: Fail if MCE or MetalLB is missing
  ansible.builtin.assert:
    that:
      - kubevirt_crds.results | selectattr('rc', 'ne', 0) | list | length == 0
    fail_msg: >-
      Missing on the management cluster:
      {{ kubevirt_crds.results | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}.
      MCE (HyperShift) and MetalLB come from
      `ansible-playbook -i inventory/hosts setup_hub_cluster.yaml --tags acm --ask-vault-pass`
      run from the repository root.

- name: Check the pull secret is loaded
  ansible.builtin.assert:
    that:
      - pull_secret is defined
      - ssh_key is defined
    fail_msg: pull_secret comes from ../vault.yaml - run with --ask-vault-pass.

# The L1 hub VMs can only run L2 VMs if the host's KVM module allows nesting.
# roles/setup-bm-host writes kvm-intel nested=1; it takes effect once the
# module is reloaded (or the host rebooted). On a management cluster that is
# real bare metal neither file matters and this is skipped.
- name: Read the host's nested-virtualisation setting
  ansible.builtin.slurp:
    src: "/sys/module/{{ item }}/parameters/nested"
  loop: [kvm_intel, kvm_amd]
  register: kubevirt_nested
  failed_when: false

- name: Fail if KVM is loaded without nesting
  ansible.builtin.assert:
    that:
      - (kubevirt_nested.results | selectattr('content', 'defined')
         | map(attribute='content') | map('b64decode') | map('trim')
         | select('in', ['Y', '1']) | list | length) > 0
    fail_msg: >-
      KVM on this host does not allow nested guests, so the hub's VMs cannot
      run the hosted cluster's worker VMs. Set it and reload the module with
      every VM stopped (or reboot):
      echo 'options kvm-intel nested=1' > /etc/modprobe.d/kvm-nested.conf
      (kvm-amd on AMD), then `modprobe -r kvm_intel && modprobe kvm_intel`.
  when: kubevirt_nested.results | selectattr('content', 'defined') | list | length > 0

# api.<name> has to resolve to the cluster's MetalLB address before the
# HostedCluster is created: the workers find their API by that name. The
# helper serves it; roles/setup-dns renders it from the same
# hosted_cluster_metallb_pools entry this run reads.
- name: Resolve each cluster's API name on the helper
  ansible.builtin.command:
    cmd: dig +short {{ item.api_hostname }} @{{ lab_network_prefix }}.{{ ip_list.helper_server }}
  loop: "{{ kubevirt_specs }}"
  loop_control:
    label: "{{ item.api_hostname }}"
  register: kubevirt_api_dns
  changed_when: false
  failed_when: false

- name: Fail if an API name does not resolve to its address
  ansible.builtin.assert:
    that:
      - item.item.api_vip in item.stdout_lines
    fail_msg: >-
      {{ item.item.api_hostname }} resolves to
      '{{ item.stdout | default('', true) | trim | default('nothing', true) }}', not
      {{ item.item.api_vip }}{{ ((item.rc | default(0)) != 0) | ternary(' (dig failed: ' ~ (item.stderr | default('') | trim) ~ ')', '') }}.
      Render the zone from the repository root:
      ansible-playbook -i inventory/hosts setup_bm_host.yaml --tags dns
      --ask-vault-pass -e target_hub={{ kubevirt_mgmt }}
  loop: "{{ kubevirt_api_dns.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Resolve each MetalLB-ingress cluster's *.apps on the helper
  ansible.builtin.command:
    cmd: dig +short console-openshift-console.apps.{{ item.name }}.{{ item.domain }} @{{ lab_network_prefix }}.{{ ip_list.helper_server }}
  loop: "{{ kubevirt_specs | selectattr('ingress', 'eq', 'metallb') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: kubevirt_apps_dns
  changed_when: false
  failed_when: false

- name: Fail if *.apps does not resolve to the MetalLB address
  ansible.builtin.assert:
    that:
      - item.item.apps_vip in item.stdout_lines
    fail_msg: >-
      *.apps.{{ item.item.name }}.{{ item.item.domain }} does not resolve to
      {{ item.item.apps_vip }}. setup-dns publishes it from
      hosted_cluster_node_keys['{{ item.item.name }}'].apps_vip:
      ansible-playbook -i inventory/hosts setup_bm_host.yaml --tags dns
      --ask-vault-pass -e target_hub={{ kubevirt_mgmt }}
  loop: "{{ kubevirt_apps_dns.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# The worker root disks and kubevirt-csi both fall back to the default
# StorageClass. Name it, and say what LVM Storage costs.
- name: Read the default StorageClass
  ansible.builtin.shell:
    cmd: >-
      oc get sc -o jsonpath='{range .items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")]}{.metadata.name} {.provisioner}{"\n"}{end}'
  register: kubevirt_default_sc
  changed_when: false

- name: Fail if a disk has no StorageClass to come from
  ansible.builtin.assert:
    that:
      - kubevirt_default_sc.stdout | trim | length > 0
        or (kubevirt_specs | selectattr('root_volume_storage_class', 'eq', '') | list | length == 0
            and kubevirt_specs | selectattr('csi_mapping', 'eq', []) | list | length == 0)
    fail_msg: >-
      The management cluster has no default StorageClass, and a cluster in
      this run relies on one (empty root_volume_storage_class or no
      csi_storage_class_mapping). Set use_lvm_storage or build Ceph
      (setup_ceph.yaml, setup_ceph_odf.yaml), or name the classes in
      kubevirt/vars.yaml.

- name: Say what the default StorageClass means for the worker VMs
  ansible.builtin.debug:
    msg: >-
      Default StorageClass: {{ kubevirt_default_sc.stdout | trim | default('none', true) }}.
      {{ ('topolvm' in kubevirt_default_sc.stdout)
         | ternary('It is LVM Storage - ReadWriteOnce, so worker VMs cannot live-migrate and a hub node drain stops the workers on it. Fine for a lab; use the Ceph RBD class for RWX block if hub maintenance must not touch the hosted cluster.',
                   'Root disks and kubevirt-csi volumes come from it unless kubevirt/vars.yaml names another class.') }}
