## Ansible reads ansible.cfg from the CURRENT WORKING DIRECTORY, not from the
## playbook's directory. Running this lab from inside kubevirt/ therefore does
## not pick up the repository root's ansible.cfg, so it is mirrored here - the
## same arrangement as compact-cluster/ansible.cfg and udn-bgp-evpn/ansible.cfg.
##
## Keep the [defaults] below in step with ../ansible.cfg.
[defaults]
## host_key_checking replaces `host_key_auto_add = True`, which was ignored:
## that key belongs to [paramiko_connection], not [defaults], so host key
## checking silently stayed on. The inventory is the repository's, one level up
## from this directory - which is the working directory whenever this file is
## the one Ansible reads. Explicit -i on the command line still wins. See
## ../ansible.cfg for the full reasoning.
host_key_checking = False
inventory = ../inventory/hosts

## This lab's own roles (kubevirt-mgmt, kubevirt-hosted-cluster) are found in
## ./roles/ next to the playbook with no configuration. ../roles adds the
## repository's shared roles, which the MetalLB ingress toggle uses
## (setup-hcp-ingress-metallb - the same role compact-cluster-hcp.md runs for
## hcp-compact1).
##
## Relative to the WORKING DIRECTORY, which is why the documented way to run
## this lab is `cd kubevirt` first. The three system defaults are kept because
## naming roles_path replaces them.
roles_path = ./roles:../roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
