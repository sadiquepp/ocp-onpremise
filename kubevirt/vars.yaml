## ===========================================================================
## kubevirt/vars.yaml - hosted clusters on the KubeVirt platform
## ===========================================================================
##
## Hosted clusters whose worker nodes are VMs that the NodePool creates on the
## management cluster's OpenShift Virtualization. In this lab the management
## cluster is the hub, whose nodes are themselves libvirt VMs, so the workers
## are NESTED VMs:
##
##   L0  the RHEL host (kvm nested=1, set by roles/setup-bm-host)
##   L1  hub VMs (--cpu host-passthrough)  - OpenShift Virtualization, MCE
##   L2  hosted-cluster workers            - KubeVirt VMs from the NodePool
##
## Every variable this use case owns lives here, prefixed kubevirt_. Loaded
## AFTER ../vars.yaml by setup_hosted_cluster_kubevirt.yaml, so anything below
## may refer to base variables (hub_install_folder, base_domain, ...).
##
## WHICH clusters are KubeVirt is NOT decided here. They are entries in the
## root vars.yaml's hosted_clusters list with 'platform: kubevirt', because
## that list is what the rest of the lab already keys off:
##
##   roles/setup-dns       renders api.<name>.<domain> (and *.apps for the
##                         MetalLB toggle) from hosted_clusters +
##                         hosted_cluster_metallb_pools
##   roles/setup-hub-acm   renders the cluster's single-address API pool
##   roles/create-hosted-cluster
##                         SKIPS 'platform: kubevirt' entries - they are
##                         rendered here instead
##
## Per-cluster keys on that entry override the kubevirt_* defaults below:
##
##   hosted_clusters:
##     - name: hcp-kv1
##       platform: kubevirt
##       ingress: metallb          # kubevirt_ingress
##       nodepool_replicas: 3      # kubevirt_nodepool_replicas
##       cores: 8                  # kubevirt_worker_cores
##       memory: 24Gi              # kubevirt_worker_memory
##       root_volume_size: 64Gi    # kubevirt_root_volume_size
##       root_volume_storage_class: ocs-external-storagecluster-ceph-rbd
##
## The fuller walkthrough is README.md in this directory.

## ---------------------------------------------------------------------------
## The management cluster
## ---------------------------------------------------------------------------

## Kubeconfig of the cluster that runs the control planes AND the worker VMs.
## The hub by default. Point it at another cluster that has MCE, MetalLB and
## room for VMs (the compact cluster, say) and set kubevirt_mgmt to match.
kubevirt_mgmt_kubeconfig: "{{ hub_install_folder }}/auth/kubeconfig"

## The key this management cluster has in hosted_cluster_metallb_pools[<name>].ip
## - the same 'hub'/'hub2'/'compact' selector roles/setup-hub-acm calls
## metallb_hub and roles/setup-dns calls target_hub. It picks the API address.
kubevirt_mgmt: "{{ target_hub | default('hub') }}"

## Which cluster names this run handles. Empty = every 'platform: kubevirt'
## entry in hosted_clusters that has an address for kubevirt_mgmt. Narrow a run
## to one with -e kubevirt_cluster=hcp-kv1.
kubevirt_cluster: ""

## ---------------------------------------------------------------------------
## Ingress for the hosted cluster's *.apps
## ---------------------------------------------------------------------------
##
## route    (default) the management cluster's own router. HyperShift sets
##          spec.platform.kubevirt.baseDomainPassthrough, so the hosted
##          cluster's apps are *.apps.<name>.<mgmt apps domain> - already
##          covered by the hub's wildcard DNS record - and it creates a
##          wildcard passthrough Route in the control-plane namespace that the
##          hub's router matches by SNI. Needs the hub's default
##          IngressController to admit wildcard routes, which kubevirt-mgmt
##          turns on. Workers keep the default pod network only.
##
## metallb  MetalLB INSIDE the hosted cluster hands its *.apps address
##          (hosted_cluster_node_keys[<name>].apps_vip in the root vars.yaml)
##          to a LoadBalancer Service in front of its routers - the same
##          ../roles/setup-hcp-ingress-metallb hcp-compact1 uses. For the
##          address to be reachable the workers must sit on the lab network,
##          so they get ONE NIC, on an OVN-Kubernetes localnet secondary
##          network bridged to the hub's br-ex (a Multus NAD), and none on the
##          default pod network. libvirt's dnsmasq gives that NIC a DHCP lease
##          on .201-.249. The cluster's domain is
##          hosted_cluster_domains[<name>] (hub.<base_domain> for hcp-kv1), and
##          *.apps.<name>.<that> must resolve to apps_vip: setup-dns does that.
##
## baseDomainPassthrough is immutable: to switch a cluster between the two,
## destroy it (--tags destroy) and create it again.
kubevirt_ingress: route

## ---------------------------------------------------------------------------
## Worker VMs (the NodePool)
## ---------------------------------------------------------------------------

## 4 vCPU / 16 GiB: two workers of 8.5 GiB fill up on the hosted cluster's own
## operators alone (see compact_hosted_cluster_memory in the root vars.yaml).
## The hub's three workers are 32 vCPU / 48 GiB, and also carry the hosted
## control planes, so 2-6 of these fit.
kubevirt_nodepool_replicas: 2
kubevirt_worker_cores: 4
kubevirt_worker_memory: 16Gi

## The root disk, a PVC on the management cluster that CDI fills from the RHCOS
## KubeVirt image in the release payload.
##
## Empty storage class = the management cluster's default StorageClass. On a
## hub built the ../steps.md way (use_lvm_storage: false, Ceph attached with
## setup_ceph_odf.yaml) that is ocs-external-storagecluster-ceph-rbd, and CDI
## gives the root disks ReadWriteMany block, so the VMs live-migrate when a
## hub node drains. On a hub built with use_lvm_storage it is lvms-vg1:
## ReadWriteOnce, so draining a hub node stops the worker VMs on it instead.
kubevirt_root_volume_size: 32Gi
kubevirt_root_volume_storage_class: ""
## Empty = let CDI's StorageProfile for that class choose.
kubevirt_root_volume_access_mode: ""
kubevirt_root_volume_mode: ""

## ---------------------------------------------------------------------------
## Storage inside the hosted cluster (kubevirt-csi passthrough)
## ---------------------------------------------------------------------------
##
## A PVC in the hosted cluster becomes a DataVolume in its control-plane
## namespace on the management cluster, hot-plugged into the worker VM.
##
## Default: the guest gets one StorageClass, backed by the management cluster's
## default StorageClass. Set a mapping to choose the infra class (and the name
## the guest sees) explicitly:
##   kubevirt_csi_storage_class_mapping:
##     - infra: ocs-external-storagecluster-ceph-rbd
##       guest: kubevirt-csi-rbd
kubevirt_csi_storage_class_mapping: []

## ---------------------------------------------------------------------------
## The localnet secondary network (ingress: metallb only)
## ---------------------------------------------------------------------------

## The OVN localnet name. It is the bridge mapping on every management-cluster
## worker (an NMState NNCP) AND the 'name' in each NAD's CNI config - OVN joins
## the two on that string, so they must match.
kubevirt_localnet_name: kubevirt-lab

## The OVS bridge the localnet maps onto. br-ex is OVN-Kubernetes' bridge on
## the node's lab-network NIC, so the worker VMs land on 192.168.122.0/24 with
## no extra NIC on the hub VMs.
kubevirt_localnet_bridge: br-ex

## Which management-cluster nodes get the bridge mapping - the ones that run
## worker VMs.
kubevirt_localnet_node_selector:
  node-role.kubernetes.io/worker: ""

## The NAD's name; one per hosted cluster, in its control-plane namespace.
kubevirt_localnet_nad: "{{ kubevirt_localnet_name }}"

## ---------------------------------------------------------------------------
## Import into ACM
## ---------------------------------------------------------------------------
##
## MCE's hypershift add-on imports every HostedCluster by itself once its
## control plane is available: it creates the ManagedCluster (hosted on
## local-cluster, klusterlet in Hosted mode) and, with ACM, the
## KlusterletAddonConfig. So this playbook leaves it alone.
##
## true: render 04-acm-import.yaml and apply it after the NodePool - for a hub
## with that auto-import turned off. It is the same objects, so on a hub that
## does auto-import it only merges into what is already there.
kubevirt_acm_import: false

## ---------------------------------------------------------------------------
## Operators on the management cluster
## ---------------------------------------------------------------------------

## Follows acm_catalog_source when the root vars.yaml sets one - which is how a
## disconnected hub points every operator at its mirrored catalog.
kubevirt_catalog_source: "{{ acm_catalog_source | default('redhat-operators', true) }}"
kubevirt_catalog_source_namespace: "{{ acm_catalog_source_namespace | default('openshift-marketplace', true) }}"
kubevirt_cnv_channel: stable
kubevirt_nmstate_channel: stable

## ---------------------------------------------------------------------------
## Run behaviour
## ---------------------------------------------------------------------------

## false: render the bundles under kubevirt/rendered/ and stop. Nothing is
## applied to the management cluster.
kubevirt_apply: true

## Where the rendered bundles go, one file per cluster.
kubevirt_render_dir: "{{ playbook_dir }}/rendered"

## Where each hosted cluster's admin kubeconfig is written - the same path
## ../roles/setup-hcp-ingress-metallb uses, so both find it.
kubevirt_kubeconfig_dir: "{{ download_dir }}"

## Waits. Nested workers are slow: CDI imports the RHCOS image, the VM boots
## twice, and the hosted cluster's operators then roll out on it.
kubevirt_hostedcluster_retries: 90
kubevirt_hostedcluster_delay: 20
kubevirt_nodepool_retries: 120
kubevirt_nodepool_delay: 30
kubevirt_operator_retries: 90
kubevirt_operator_delay: 10
