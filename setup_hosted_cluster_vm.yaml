## Creates the worker VMs a hosted cluster's NodePool draws its Agents from,
## and boots them off the hub InfraEnv's discovery ISO so they register as
## Agents in the bminfra namespace.
##
## Connected (default):
##   ansible-playbook -i inventory/hosts setup_hosted_cluster_vm.yaml --ask-vault-pass
## builds hosted_cluster_workers (c1_worker1..3, ip_list.c1worker*) against the
## hub selected by target_hub, exactly as before.
##
## Disconnected:
##   ansible-playbook -i inventory/hosts setup_hosted_cluster_vm.yaml --ask-vault-pass \
##     -e disconnected_install=true
## builds hosted_cluster_disconnected_workers (c1-d-worker1..3,
## ip_list.c1dworker*) instead, against the hub installed by
## setup_hub_cluster.yaml with the same flag, and cuts those three IPs off from
## the real internet first so the cluster can only ever pull from the local
## mirror registry. disconnected_install wins over target_hub, same as in
## setup_bminfra.yaml.
##
## The compact cluster's hosted cluster (hcp-compact1):
##   ansible-playbook -i inventory/hosts setup_hosted_cluster_vm.yaml --ask-vault-pass \
##     -e target_hub=compact
## builds compact_hosted_cluster_workers (two VMs, ip_list.hcpc1worker*)
## against the compact cluster's InfraEnv (setup_bminfra.yaml -e
## target_hub=compact), and adds their DHCP reservations to the running
## libvirt network first - redefining the network would cut the compact
## cluster off it.
##
## BareMetalHosts instead of plain Agents (the hub's connected workers only):
##   ansible-playbook -i inventory/hosts setup_hosted_cluster_vm.yaml --ask-vault-pass \
##     -e hosted_cluster_worker_provisioning=bmh
## defines the same VMs powered off with an empty CD-ROM, gives each a Redfish
## BMC through sushy-emulator on this host (roles/setup-sushy-emulator), and
## creates a BareMetalHost and BMC secret per VM in the agent namespace. The
## hub then powers them on and boots them from the discovery ISO as virtual
## media, and approves the Agents itself. Needs sushy_emulator_password in
## vault.yaml. See hosted_cluster_worker_provisioning in vars.yaml.
##
## Only the powered-off VMs, for setting sushy-emulator up by hand
## (sushy-emulator-manual.md):
##   ansible-playbook -i inventory/hosts setup_hosted_cluster_vm.yaml \
##     -e hosted_cluster_worker_provisioning=bmh --tags bmh-vms
##
## Both paths run the same tasks - only the worker set, the VM folder and the
## sizing differ (see the "Select the worker set" task below and the
## disconnected block in vars.yaml) - plus one step the disconnected path needs
## on its own: the hub InfraEnv's ignitionConfigOverride, which is what lets the
## workers pull the assisted-installer agent from the mirror registry without a
## Red Hat signature. Without it they boot and never register as Agents.

- name: Setting Up Hosted Cluster
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
  vars:
    ## Anything not named here is hub1, as before.
    hub_install_folders:
      hub: "{{ hub_install_folder }}"
      hub2: "{{ hub2_install_folder }}"
      compact: "{{ compact_install_folder }}"
    hub_install_folder_selected: >-
      {{ hub_disconnected_install_folder
         if (disconnected_install | default(false) | bool)
         else (hub_install_folders[target_hub | default('hub')] | default(hub_install_folder)) }}
    hcp_on_compact: >-
      {{ not (disconnected_install | default(false) | bool)
         and (target_hub | default('hub')) == 'compact' }}
    hub_kubeconfig: "{{ hub_install_folder_selected }}/auth/kubeconfig"
  environment:
    KUBECONFIG: "{{ hub_kubeconfig }}"
  tasks:
    # One set of facts drives every task below, so the connected and
    # disconnected runs differ in their inputs rather than in their steps.
    #
    # Tagged always because every `when: hcp_disconnected` below reads these -
    # a --tags disconnected-nat or --tags discovery-ignition run would
    # otherwise skip this task and fail on the undefined fact.
    - name: Select the worker set, VM folder and sizing for this run
      tags: [always]
      ansible.builtin.set_fact:
        hcp_disconnected: "{{ disconnected_install | default(false) | bool }}"
        hcp_workers: >-
          {{ hosted_cluster_disconnected_workers
             if (disconnected_install | default(false) | bool)
             else (compact_hosted_cluster_workers if hcp_on_compact | bool
                   else hosted_cluster_workers) }}
        hcp_vm_folder: >-
          {{ hosted_cluster_disconnected_vm_folder
             if (disconnected_install | default(false) | bool)
             else (compact_hosted_cluster_vm_folder if hcp_on_compact | bool
                   else hosted_cluster_vm_folder) }}
        hcp_vm_memory: >-
          {{ hosted_cluster_disconnected_memory
             if (disconnected_install | default(false) | bool)
             else (compact_hosted_cluster_memory if hcp_on_compact | bool
                   else hosted_cluster_memory) }}
        hcp_vm_cpu: >-
          {{ hosted_cluster_disconnected_cpu
             if (disconnected_install | default(false) | bool)
             else (compact_hosted_cluster_cpu if hcp_on_compact | bool
                   else hosted_cluster_cpu) }}

    # agent (default): boot the VMs off the discovery ISO, as always.
    # bmh: same VMs, but each gets a Redfish BMC and a BareMetalHost, and the
    # hub boots them. See hosted_cluster_worker_provisioning in vars.yaml.
    - name: Select how the workers join the InfraEnv
      tags: [always]
      ansible.builtin.set_fact:
        hcp_worker_bmh: "{{ (hosted_cluster_worker_provisioning | default('agent')) == 'bmh' }}"

    - name: Fail fast on an unknown provisioning mode
      tags: [always]
      ansible.builtin.assert:
        that:
          - (hosted_cluster_worker_provisioning | default('agent')) in ['agent', 'bmh']
        fail_msg: >-
          hosted_cluster_worker_provisioning must be 'agent' or 'bmh', not
          '{{ hosted_cluster_worker_provisioning }}'.

    - name: Fail fast if --tags bmh-vms is used without bmh mode
      tags: [always]
      ansible.builtin.assert:
        that:
          - "'bmh-vms' not in ansible_run_tags or (hcp_worker_bmh | bool)"
        fail_msg: >-
          --tags bmh-vms defines the worker VMs for BareMetalHosts (powered
          off, empty CD-ROM). Add -e hosted_cluster_worker_provisioning=bmh.

    - name: Fail fast if bmh is asked for workers it does not cover
      tags: [always]
      ansible.builtin.assert:
        that:
          - not (hcp_worker_bmh | bool) or not (hcp_disconnected | bool)
          - not (hcp_worker_bmh | bool) or not (hcp_on_compact | bool)
        fail_msg: >-
          hosted_cluster_worker_provisioning=bmh covers the hub's connected
          hosted cluster workers (hosted_cluster_workers) only. Build the
          disconnected and compact-cluster workers with agent.

    - name: Report which hosted cluster's VMs are being built
      ansible.builtin.debug:
        msg: >-
          {{ hcp_disconnected | ternary('Disconnected', 'Connected') }} hosted
          cluster VMs: {{ hcp_workers | map(attribute='name') | join(', ') }}
          in {{ hcp_vm_folder }},
          {{ 'as BareMetalHosts with Redfish BMCs, booted by the hub at ' ~ hub_kubeconfig
             if hcp_worker_bmh | bool
             else 'discovery ISO from ' ~ hub_kubeconfig }}

    # The hub's Bare Metal Operator is what acts on a BareMetalHost. It runs
    # once a Provisioning CR exists - roles/setup-hub-acm applies one, watching
    # all namespaces so the agent namespace is included.
    - name: Check the hub's Bare Metal Operator watches all namespaces (bmh)
      ansible.builtin.command: >-
        oc get provisioning provisioning-configuration
        -o jsonpath='{.spec.watchAllNamespaces}'
      register: hcp_provisioning
      changed_when: false
      failed_when: false
      when: hcp_worker_bmh | bool

    - name: Fail with a clear message if it does not
      ansible.builtin.fail:
        msg: >-
          The hub at {{ hub_kubeconfig }} has no Provisioning CR with
          watchAllNamespaces: true, so nothing would act on the
          BareMetalHosts in {{ oadp_bminfra_namespace }}. Apply
          roles/setup-hub-acm/files/acm/04b-provisioning.yaml and wait for
          the metal3 pod in openshift-machine-api.
      when:
        - hcp_worker_bmh | bool
        - hcp_provisioning.stdout | default('') | trim != 'true'

    # The BMC password, for the emulator and the BareMetalHosts' secrets. Only
    # loaded in bmh mode, so an agent run needs nothing new from the vault.
    - name: Load the BMC password from vault.yaml (bmh)
      ansible.builtin.include_vars:
        file: vault.yaml
      when: hcp_worker_bmh | bool

    # Only the disconnected workers get their egress cut - the connected
    # hosted clusters, the mirror registry, MinIO, the helper and the load
    # balancer all stay reachable. Done before the VMs exist so nothing ever
    # boots with a working route to quay.io.
    - name: Cut the disconnected hosted cluster's workers off from the real internet
      ansible.builtin.include_tasks: roles/setup-hub-cluster-disconnected/tasks/block-node-nat.yml
      vars:
        disconnected_nat_enabled: "{{ hosted_cluster_disconnected_block_node_nat }}"
        disconnected_nat_ip_keys: "{{ hcp_workers | map(attribute='ip_key') | list }}"
        disconnected_nat_label: "{{ (hosted_clusters_disconnected | default(['hcp-disconnected'])) | first }}"
      when: hcp_disconnected
      tags: [disconnected-nat]

    # The discovery ISO this playbook boots the workers from is built by the
    # hub's InfraEnv, not here - so the one thing that has to be right before
    # it is downloaded is that InfraEnv's ignition. Without the override below
    # the workers boot, fail to pull the assisted-installer agent ("A signature
    # was required, but no signature exists") and never register, so no Agent
    # ever shows up in the InfraEnv. See
    # roles/setup-bminfra/tasks/disconnected-ignition-override.yml.
    #
    # This patches the live InfraEnv and waits for the ISO to be rebuilt, so a
    # hub whose InfraEnv predates the override is fixed in place rather than
    # needing setup_bminfra.yaml re-run.
    - name: Make sure the hub InfraEnv's discovery ISO skips image signature checks
      ansible.builtin.include_tasks: roles/setup-bminfra/tasks/ensure-ignition-override.yml
      when: hcp_disconnected
      tags: [discovery-ignition]

    # bmh mode never touches the ISO here: the hub hands its URL to the BMC.
    - name: Download discovery ISO from hub InfraEnv
      ansible.builtin.include_tasks: roles/setup-bminfra/tasks/download-discovery-iso.yml
      when: not (hcp_worker_bmh | bool)

    # The hub's hosted cluster workers get their DHCP reservations from the
    # libvirt network definition setup_bm_host.yaml renders, which it applies
    # by destroying and redefining the network - fine before anything runs on
    # it, not with the compact cluster up. So a compact run adds its workers'
    # reservations to the RUNNING network instead (--live --config), the way
    # roles/setup-compact-cluster adds its nodes'. Same FQDN the template
    # renders, so a later rebuild changes nothing.
    - name: Read the default network's current definition
      ansible.builtin.command: virsh net-dumpxml default
      register: hcp_net_xml
      changed_when: false
      when: hcp_on_compact | bool

    - name: Reserve each worker's address on the running network
      ansible.builtin.command:
        cmd: >-
          virsh net-update default add ip-dhcp-host
          "<host mac='{{ hcp_worker_mac }}' name='{{ item.ip_key }}.{{ hcp_worker_zone }}'
                 ip='{{ lab_network_prefix }}.{{ ip_list[item.ip_key] }}'/>"
          --live --config
      loop: "{{ hcp_workers }}"
      loop_control:
        label: "{{ item.name }} {{ hcp_worker_mac }}"
      vars:
        hcp_worker_mac: "52:54:00:e2:54:{{ '%02d' | format(ip_list[item.ip_key] | int) }}"
        hcp_worker_cluster: >-
          {{ (hosted_cluster_node_keys | dict2items
              | selectattr('value.workers', 'defined')
              | selectattr('value.workers', 'contains', item.ip_key)
              | map(attribute='key') | first) | default('') }}
        hcp_worker_zone: >-
          {{ hcp_worker_cluster }}.{{ (hosted_cluster_domains | default({}))[hcp_worker_cluster] | default(base_domain) }}
      when:
        - hcp_on_compact | bool
        - hcp_worker_mac not in (hcp_net_xml.stdout | lower)
      changed_when: true

    - name: Create Directory for Hosted Cluster VMs
      tags: [bmh-vms]
      file:
        path: "{{ hcp_vm_folder }}"
        state: directory

    # bmh mode leaves an existing disk alone, so re-running --tags bmh-vms
    # cannot wipe a worker. agent mode recreates it as it always has.
    - name: Define Disks for Hosted Cluster
      tags: [bmh-vms]
      shell: |
        qemu-img create \
        -f qcow2 \
        -o preallocation=metadata \
        {{ hcp_vm_folder }}/{{ item.name }}.qcow2 \
        120G
      args:
        creates: "{{ (hcp_vm_folder ~ '/' ~ item.name ~ '.qcow2') if (hcp_worker_bmh | bool) else omit }}"
      loop: "{{ hcp_workers }}"
      loop_control:
        label: "{{ item.name }}"

    # --import with an explicit hd,cdrom boot order, not --cdrom, for the
    # reason given in roles/setup-sno/tasks/vm.yml and used by
    # roles/setup-compact-cluster too.
    #
    # --cdrom is virt-install's "install from this media" mode. It sets the
    # domain up as an install session around the ISO, which assumes the guest
    # reboots once when the installer is finished. The assisted-installer
    # agent does not work that way - it writes RHCOS to the disk and reboots
    # the machine to run it - and the session gets in the way of that reboot:
    # depending on the virt-install version the worker either powers off
    # partway through provisioning (the NodePool then waits until someone
    # starts the VM by hand) or boots back into the agent off the ISO, which
    # is the symptom roles/setup-sno/tasks/vm.yml describes.
    #
    # --import defines the domain without an install phase, and hd,cdrom gives
    # it the boot order these nodes actually want: the disk is empty on the
    # first boot so the VM falls through to the discovery ISO, and once RHCOS
    # is on the disk every later boot - including the agent's own reboot -
    # comes up from it. The ISO stays attached and is simply never reached.
    - name: Deploy Workers for Hosted Cluster
      shell: |
        virt-install \
        --import \
        --ram {{ hcp_vm_memory }} \
        --vcpus {{ hcp_vm_cpu }} \
        --os-variant rhel9.5 \
        --disk path={{ hcp_vm_folder }}/{{ item.name }}.qcow2,device=disk,bus=virtio,format=qcow2,cache=none \
        --disk path={{ discovery_image_url }},device=cdrom,bus=sata,readonly=on \
        --boot hd,cdrom \
        --memballoon model=virtio,freePageReporting=on \
        --noautoconsole \
        --vnc \
        --network network:default,mac=52:54:00:e2:54:{{ '%02d' | format(ip_list[item.ip_key] | int) }} \
        --name {{ item.name }} \
        --cpu host-passthrough
      loop: "{{ hcp_workers }}"
      loop_control:
        label: "{{ item.name }} ({{ lab_network_prefix }}.{{ ip_list[item.ip_key] }})"
      when: not (hcp_worker_bmh | bool)

    # ---- bmh mode -----------------------------------------------------------
    # The same VM as above - CPU, memory, disk, MAC, BIOS firmware, hd,cdrom
    # boot order - with two differences: the CD-ROM is empty, because the hub
    # inserts the discovery ISO as virtual media, and the VM is defined but not
    # started, because powering it on is the hub's job (the BareMetalHost is
    # online: true). --print-xml plus virsh define is what keeps it off.
    - name: Check which worker VMs are already defined (bmh)
      tags: [bmh-vms]
      ansible.builtin.command: virsh dominfo {{ item.name }}
      loop: "{{ hcp_workers }}"
      loop_control:
        label: "{{ item.name }}"
      register: hcp_bmh_dominfo
      changed_when: false
      failed_when: false
      when: hcp_worker_bmh | bool

    - name: Define the worker VMs powered off, with an empty CD-ROM (bmh)
      tags: [bmh-vms]
      ansible.builtin.shell: |
        set -e
        virt-install \
        --import \
        --ram {{ hcp_vm_memory }} \
        --vcpus {{ hcp_vm_cpu }} \
        --os-variant rhel9.5 \
        --disk path={{ hcp_vm_folder }}/{{ item.item.name }}.qcow2,device=disk,bus=virtio,format=qcow2,cache=none \
        --disk device=cdrom,bus=sata,readonly=on \
        --boot hd,cdrom \
        --memballoon model=virtio,freePageReporting=on \
        --vnc \
        --network network:default,mac=52:54:00:e2:54:{{ '%02d' | format(ip_list[item.item.ip_key] | int) }} \
        --name {{ item.item.name }} \
        --cpu host-passthrough \
        --print-xml > {{ hcp_vm_folder }}/{{ item.item.name }}.xml
        virsh define {{ hcp_vm_folder }}/{{ item.item.name }}.xml
      loop: "{{ hcp_bmh_dominfo.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }} ({{ lab_network_prefix }}.{{ ip_list[item.item.ip_key] }})"
      when:
        - hcp_worker_bmh | bool
        - item.rc != 0

    - name: Report the VMs-only run (--tags bmh-vms)
      tags: [bmh-vms]
      ansible.builtin.debug:
        msg:
          - "Defined, powered off, empty CD-ROM: {{ hcp_workers | map(attribute='name') | join(', ') }}"
          - "Next: sushy-emulator-manual.md from step 2, or re-run without --tags for sushy and the BareMetalHosts."
      when: "'bmh-vms' in ansible_run_tags"

    # Gives each VM its Redfish BMC, restricted to exactly these VMs, and sets
    # sushy_emulator_systems (name, uuid, BMC address) for the BareMetalHosts.
    - name: Give each worker VM a Redfish BMC (bmh)
      ansible.builtin.include_role:
        name: setup-sushy-emulator
        # Its defaults (sushy_emulator_username and the rest) are needed by
        # the BareMetalHosts template below, outside the role.
        public: true
      vars:
        sushy_emulator_domains: "{{ hcp_workers | map(attribute='name') | list }}"
      when: hcp_worker_bmh | bool

    - name: Render the BMC secrets and BareMetalHosts (bmh)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/roles/setup-bminfra/templates/05-baremetalhosts.yaml.j2"
        dest: "{{ playbook_dir }}/roles/setup-bminfra/templates/.rendered-05-baremetalhosts.yaml"
        mode: '0600'
      when: hcp_worker_bmh | bool

    - name: Apply the BMC secrets and BareMetalHosts (bmh)
      ansible.builtin.command: >-
        oc apply -f {{ playbook_dir }}/roles/setup-bminfra/templates/.rendered-05-baremetalhosts.yaml
      register: hcp_bmh_apply
      changed_when: "'created' in hcp_bmh_apply.stdout or 'configured' in hcp_bmh_apply.stdout"
      when: hcp_worker_bmh | bool

    # Unlike the other rendered bminfra files, this one holds the BMC
    # password - do not leave it lying around.
    - name: Remove the rendered BareMetalHosts file (bmh)
      ansible.builtin.file:
        path: "{{ playbook_dir }}/roles/setup-bminfra/templates/.rendered-05-baremetalhosts.yaml"
        state: absent
      when: hcp_worker_bmh | bool

    - name: Report what happens next (bmh)
      ansible.builtin.debug:
        msg:
          - "BareMetalHosts created in {{ oadp_bminfra_namespace }}: {{ hcp_workers | map(attribute='ip_key') | join(', ') }}"
          - "The hub now powers each VM on and boots it from the discovery ISO as virtual media."
          - "Watch: oc get bmh,agents -n {{ oadp_bminfra_namespace }}"
          - "The Agents are approved automatically - no approval in the UI."
          - "BMCs: {{ sushy_emulator_systems | map(attribute='address') | join(', ') }}"
      when: hcp_worker_bmh | bool
