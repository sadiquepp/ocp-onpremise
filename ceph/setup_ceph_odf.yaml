## Exports the Ceph cluster (setup_ceph.yaml) for OpenShift Data
## Foundation (ODF) "external mode" to consume as PVs, then installs
## ODF and wires up the external StorageCluster on the target OCP
## cluster.
##
## Runs in three ordered plays, because ODF must be installed before
## we can export (the exporter script has to match the installed
## operator version - an older upstream script emits CSI credentials
## under key names a newer operator won't read, which silently leaves
## the StorageCluster stuck "Progressing"):
##   0. (part of play 1) read the target cluster's OCP version and
##      stop if its node kernel cannot map RBD images from the
##      ceph_version release (RHCS 9 needs OCP 4.21+; see
##      ceph_releases in ../vars.yaml). Skip with
##      -e ceph_odf_skip_krbd_check=true if you will mount through an
##      rbd-nbd StorageClass instead (README.md, Requirements).
##   1. consumer stage 'install' - install ODF, extract the
##      version-matched exporter script from the operator CSV
##   2. export - create the pool/CephFS on the Ceph cluster and run
##      that script (on cephadmin) to produce the connection JSON
##   3. consumer stage 'create' - create the external-cluster secret
##      and StorageCluster CR from that JSON
##
## IMPORTANT - read before running: by default the consumer plays
## target the same hub cluster every other *.yaml in this repo does
## (hub_kubeconfig, same target_hub switch as oadp/setup_oadp.yaml). But
## the hub already runs the LVM Storage operator in the
## openshift-storage namespace (roles/setup-lvm-storage, part of the
## standard-cluster/ build) - and ODF external mode wants that exact same namespace.
## Running both on the same cluster is not something this repo has
## tested and may conflict. Pick one:
##   - remove LVM Storage from the hub first, or
##   - point this at a different cluster's kubeconfig instead:
##       -e ceph_odf_target_kubeconfig=/path/to/some/other/kubeconfig
##
## The exporter script and the connection JSON land in ceph-odf/ next to
## this playbook (ceph_odf_export_dir in ../vars.yaml) - git-ignored, it
## holds live cluster credentials.
##
## Usage (from inside ceph/ - ansible.cfg is read from the working
## directory, and the one here adds ../roles to roles_path; see
## README.md in this directory):
##   cd ceph
##   ansible-playbook -i ../inventory/hosts setup_ceph_odf.yaml --ask-vault-pass
##   ansible-playbook -i ../inventory/hosts setup_ceph_odf.yaml --ask-vault-pass -e target_hub=hub2
##   ansible-playbook -i ../inventory/hosts setup_ceph_odf.yaml --ask-vault-pass -e ceph_odf_target_kubeconfig=/path/to/kubeconfig

- name: Install ODF and extract the version-matched exporter script
  hosts: localhost
  become: true
  vars_files:
    - ../vars.yaml
    - ../vault.yaml
  vars:
    ceph_odf_target_kubeconfig: >-
      {{ (target_hub == 'hub2') | ternary(hub2_install_folder, hub_install_folder) }}/auth/kubeconfig
    ceph_odf_consumer_stage: install
  tasks:
  - name: Read the target cluster's OpenShift version
    ansible.builtin.command:
      cmd: oc get clusterversion version -o jsonpath={.status.desired.version}
    environment:
      KUBECONFIG: "{{ ceph_odf_target_kubeconfig }}"
    register: ceph_odf_target_ocp
    changed_when: false
    tags:
      - ceph-odf-install

  - name: Stop if this OCP version cannot mount RBD images from RHCS {{ ceph_version }}
    ansible.builtin.assert:
      that:
        - ceph_odf_target_ocp.stdout is version(ceph_release.min_ocp, '>=')
      fail_msg: >-
        The target cluster runs OCP {{ ceph_odf_target_ocp.stdout }}, but
        ceph_version is {{ ceph_version }} ({{ ceph_release.codename }}),
        whose RBD images its node kernel cannot map until OCP
        {{ ceph_release.min_ocp }} - PVCs would bind and then never mount
        (`failed to add secret to kernel`, CSI error 524). Build the Ceph
        cluster as ceph_version 8 instead, or rerun with
        -e ceph_odf_skip_krbd_check=true if you will add an rbd-nbd
        StorageClass (README.md, Requirements).
      success_msg: >-
        OCP {{ ceph_odf_target_ocp.stdout }} can mount RHCS
        {{ ceph_version }} RBD images.
    when: not (ceph_odf_skip_krbd_check | default(false) | bool)
    tags:
      - ceph-odf-install

  - ansible.builtin.import_role:
      name: setup-ceph-odf-consumer
    environment:
      KUBECONFIG: "{{ ceph_odf_target_kubeconfig }}"
    tags:
      - ceph-odf-install

- name: Export Ceph pool/CephFS + CSI credentials for ODF
  hosts: localhost
  become: true
  vars_files:
    - ../vars.yaml
    - ../vault.yaml
  tasks:
  - ansible.builtin.import_role:
      name: setup-ceph-odf-export
    tags:
      - ceph-odf-export
    delegate_to: "{{ lab_network_prefix }}.{{ ip_list.cephadmin }}"

- name: Create the external StorageCluster
  hosts: localhost
  become: true
  vars_files:
    - ../vars.yaml
    - ../vault.yaml
  vars:
    ceph_odf_target_kubeconfig: >-
      {{ (target_hub == 'hub2') | ternary(hub2_install_folder, hub_install_folder) }}/auth/kubeconfig
    ceph_odf_consumer_stage: create
  tasks:
  - ansible.builtin.import_role:
      name: setup-ceph-odf-consumer
    environment:
      KUBECONFIG: "{{ ceph_odf_target_kubeconfig }}"
    tags:
      - ceph-odf-create
