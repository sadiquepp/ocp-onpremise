## Ansible reads ansible.cfg from the CURRENT WORKING DIRECTORY, not from the
## playbook's directory. Running the Ceph playbooks from inside ceph/
## therefore does not pick up the repository root's ansible.cfg, so it is
## mirrored here - the same arrangement as compact-cluster/ansible.cfg and
## kubevirt/ansible.cfg.
##
## Keep the [defaults] below in step with ../ansible.cfg.
[defaults]
host_key_auto_add = True

## The Ceph playbooks use roles that stay in the repository's shared roles/
## directory: setup-ceph-vm, setup-rhsm, setup-ceph-prereqs,
## setup-ceph-cluster, setup-ceph-odf-export and setup-ceph-odf-consumer.
## Ansible searches ./roles/ next to the playbook, but not one level up; this
## adds it, and keeps the three system defaults that naming roles_path would
## otherwise replace.
##
## Relative to the WORKING DIRECTORY, which is why the documented way to run
## these playbooks is `cd ceph` first.
roles_path = ../roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
