---
# Fetch the installer, render the two manifests, and build the agent ISO.
# The same steps as roles/setup-compact-cluster/tasks/image.yml, connected
# only.

- name: Create the install and VM directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ hub_install_folder }}"
    - "{{ hub_vm_folder }}"

# Everything except THIS version's tarballs and the binaries unpacked from
# them. An agent install directory that still holds
# .openshift_install_state.json and auth/ from an earlier cluster builds an
# ISO that reuses that cluster's generated assets. Pre-flight has already
# refused to get here over a live cluster unless hub_agent_force_reinstall was
# set.
- name: Clear the previous build's generated state
  ansible.builtin.shell:
    cmd: >-
      find {{ hub_install_folder }} -mindepth 1 -maxdepth 1
      ! -name 'openshift-*-linux-{{ ocp_major_version }}.{{ ocp_minor_version }}.tar.gz'
      ! -name openshift-install ! -name oc ! -name kubectl
      ! -name README.md -print -exec rm -rf {} +
  register: hub_agent_cleared
  changed_when: hub_agent_cleared.stdout | length > 0

- name: Get the OpenShift installer for {{ ocp_major_version }}.{{ ocp_minor_version }}
  ansible.builtin.get_url:
    url: >-
      https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ ocp_major_version }}.{{ ocp_minor_version }}/openshift-install-linux.tar.gz
    dest: "{{ hub_install_folder }}/openshift-install-linux-{{ ocp_major_version }}.{{ ocp_minor_version }}.tar.gz"
    mode: '0644'

- name: Extract openshift-install
  ansible.builtin.unarchive:
    src: "{{ hub_install_folder }}/openshift-install-linux-{{ ocp_major_version }}.{{ ocp_minor_version }}.tar.gz"
    dest: "{{ hub_install_folder }}"
    remote_src: true

# Our own oc, beside the installer and on PATH only for the build, so the
# client always matches the release being installed.
- name: Get the OpenShift client for {{ ocp_major_version }}.{{ ocp_minor_version }}
  ansible.builtin.get_url:
    url: >-
      https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ ocp_major_version }}.{{ ocp_minor_version }}/openshift-client-linux.tar.gz
    dest: "{{ hub_install_folder }}/openshift-client-linux-{{ ocp_major_version }}.{{ ocp_minor_version }}.tar.gz"
    mode: '0644'

- name: Extract oc
  ansible.builtin.unarchive:
    src: "{{ hub_install_folder }}/openshift-client-linux-{{ ocp_major_version }}.{{ ocp_minor_version }}.tar.gz"
    dest: "{{ hub_install_folder }}"
    remote_src: true

# The rest of the lab calls plain `oc` (setup-lvm-storage, the UDN roles), and
# on a host where the UPI role never ran there is none on PATH. Installed only
# if absent, exactly as the UPI role does.
- name: Check whether oc is on the system PATH
  ansible.builtin.stat:
    path: /usr/bin/oc
  register: hub_agent_system_oc

- name: Install oc system-wide if this host has none
  ansible.builtin.copy:
    src: "{{ hub_install_folder }}/oc"
    dest: /usr/bin/oc
    mode: '0755'
    remote_src: true
  when: not hub_agent_system_oc.stat.exists

- name: Report the installer version
  ansible.builtin.command:
    cmd: "{{ hub_install_folder }}/openshift-install version"
  register: hub_agent_installer_version
  changed_when: false

- name: Show the installer version
  ansible.builtin.debug:
    msg: "{{ hub_agent_installer_version.stdout_lines }}"

# `agent create image` CONSUMES both manifests, so keep a readable copy.
- name: Keep a readable copy of what is being installed
  ansible.builtin.file:
    path: "{{ hub_install_folder }}/rendered"
    state: directory
    mode: '0755'

- name: Render install-config.yaml and agent-config.yaml
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ hub_install_folder }}/rendered/{{ item }}"
    mode: '0600'
  loop:
    - install-config.yaml
    - agent-config.yaml

- name: Place the manifests where the installer will consume them
  ansible.builtin.copy:
    src: "{{ hub_install_folder }}/rendered/{{ item }}"
    dest: "{{ hub_install_folder }}/{{ item }}"
    mode: '0600'
    remote_src: true
  loop:
    - install-config.yaml
    - agent-config.yaml

- name: Build the agent ISO
  ansible.builtin.command:
    cmd: "{{ hub_install_folder }}/openshift-install --dir {{ hub_install_folder }} agent create image"
  register: hub_agent_iso_build
  changed_when: true
  environment:
    PATH: "{{ hub_install_folder }}:{{ ansible_env.PATH }}"

- name: Report the ISO build
  ansible.builtin.debug:
    msg: "{{ hub_agent_iso_build.stdout_lines | default([], true) + hub_agent_iso_build.stderr_lines | default([], true) }}"

- name: Confirm the ISO exists
  ansible.builtin.stat:
    path: "{{ hub_install_folder }}/agent.x86_64.iso"
  register: hub_agent_iso

- name: Fail if the ISO was not produced
  ansible.builtin.assert:
    that: hub_agent_iso.stat.exists
    fail_msg: >-
      openshift-install reported success but there is no
      {{ hub_install_folder }}/agent.x86_64.iso. The rendered manifests are in
      {{ hub_install_folder }}/rendered/ - check them, since the installer
      consumed the originals.
    success_msg: >-
      Agent ISO built: {{ hub_install_folder }}/agent.x86_64.iso
      ({{ (hub_agent_iso.stat.size / 1024 / 1024) | round | int }} MiB).

- name: Let qemu read the ISO
  ansible.builtin.file:
    path: "{{ hub_install_folder }}/agent.x86_64.iso"
    mode: '0644'
