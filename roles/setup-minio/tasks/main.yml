---
# Tasks file for setup-minio
#
# Runs delegated to the minio VM (see setup_minio.yaml). Installs the
# MinIO server + mc client, runs it as a systemd service, and creates
# the bucket OADP will use as its backup target when disconnected.
#
# minio_root_user / minio_root_password come from vault.yaml.

- name: Wait for SSH on the minio VM
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 300

- name: Create minio-user
  ansible.builtin.user:
    name: minio-user
    system: true
    shell: /sbin/nologin
    create_home: false
  become: true

- name: Create MinIO data directory
  ansible.builtin.file:
    path: "{{ minio_data_dir }}"
    state: directory
    owner: minio-user
    group: minio-user
    mode: '0750'
  become: true

- name: Check whether the MinIO server binary is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/minio
  register: minio_binary_status

- name: Check whether the mc client is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/mc
  register: minio_mc_status
  # Checked separately from the server. Both used to hang off the server's
  # stat, so a host that had the server but no mc never got mc - and the bucket
  # tasks at the end of this file need it.

# ── The server ────────────────────────────────────────────────────────────────
# Built from source at a pinned tag: dl.min.io stopped serving the community
# binary (HTTP 410, archived) and GitHub Releases never carried one. See
# defaults/main.yml.
- name: Build and install the MinIO server
  when: not minio_binary_status.stat.exists
  become: true
  block:
    - name: Install the Go toolchain
      ansible.builtin.package:
        name: "{{ minio_build_packages }}"
        state: present

    - name: Create the build directory
      ansible.builtin.file:
        path: "{{ minio_build_dir }}"
        state: directory
        mode: '0700'

    - name: "Build MinIO {{ minio_server_release }} from source (minutes, ~1.5G of modules)"
      ansible.builtin.command:
        cmd: "go install -v github.com/minio/minio@{{ minio_server_release }}"
        creates: /usr/local/bin/minio
      environment:
        GOBIN: /usr/local/bin        # lands the binary where minio.service expects it
        GOPATH: "{{ minio_build_dir }}"
        GOCACHE: "{{ minio_build_dir }}/cache"
        GOTOOLCHAIN: auto            # fetches the go1.24.x the module requires
      async: 3600
      poll: 15
      # async/poll rather than a plain run: this takes minutes, and a long
      # silent SSH channel is what makes a build look like a hang.

    - name: Remove the build tree
      ansible.builtin.file:
        path: "{{ minio_build_dir }}"
        state: absent
      when: minio_build_cleanup | bool
  rescue:
    - name: Explain the failed build
      ansible.builtin.fail:
        msg: >-
          Building MinIO {{ minio_server_release }} failed:
          {{ ansible_failed_result.msg | default('see the task above') }}.
          There is no binary to fall back on - dl.min.io answers 410 for the
          community server and GitHub Releases has source only. Usual causes,
          in order: this VM cannot reach proxy.golang.org (the build fetches
          modules, so it needs egress); the installed Go is older than 1.21, so
          GOTOOLCHAIN cannot bootstrap the 1.24.x the module asks for
          (`go version` on the VM); or {{ minio_build_dir }} has no room for
          ~1.5G of module cache. Setting minio_build_cleanup=false keeps the
          tree for inspection.

# ── The client ────────────────────────────────────────────────────────────────
- name: Install the mc client
  ansible.builtin.get_url:
    url: "{{ minio_mc_url }}"
    dest: /usr/local/bin/mc
    checksum: "sha256:{{ minio_mc_sha256 }}"
    mode: '0755'
  become: true
  when: not minio_mc_status.stat.exists
  # mc still ships prebuilt binaries, so it needs no build. The checksum is
  # pinned as a literal rather than read from MinIO's published .sha256sum -
  # see defaults/main.yml for why that file cannot be used directly. If GitHub
  # ever drops the assets too, mc builds exactly like the server does:
  # go install github.com/minio/mc@{{ minio_mc_release }}

- name: Render MinIO environment file (root credentials)
  template:
    src: minio-env.j2
    dest: /etc/default/minio
    owner: root
    group: minio-user
    mode: '0640'
  become: true

- name: Render MinIO systemd unit
  template:
    src: minio.service.j2
    dest: /etc/systemd/system/minio.service
    mode: '0644'
  become: true
  register: minio_unit

- name: Reload systemd, enable and start MinIO
  systemd:
    name: minio
    daemon_reload: "{{ minio_unit.changed }}"
    enabled: true
    state: "{{ 'restarted' if minio_unit.changed else 'started' }}"
  become: true

- name: Wait for the MinIO API, and say why if it never answers
  block:
    - name: Wait for the MinIO API to respond
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ minio_api_port }}/minio/health/live"
        status_code: 200
      register: minio_health
      until: minio_health.status == 200
      retries: 20
      delay: 5
  rescue:
    - name: Read what the minio unit actually said
      ansible.builtin.shell: |
        systemctl status minio --no-pager -l 2>&1 | head -n 20
        echo '--- journal ---'
        journalctl -u minio -n 40 --no-pager 2>&1
      register: minio_unit_state
      changed_when: false
      failed_when: false
      become: true

    - name: Fail with the service's own error
      ansible.builtin.fail:
        msg: |
          MinIO never answered http://127.0.0.1:{{ minio_api_port }}/minio/health/live.
          "Connection refused" here means the process is not listening - it
          started and exited, so look for the fatal below rather than at the
          network.

          {{ minio_unit_state.stdout | default('(could not read the unit state)') }}

          The usual causes, in the order they bite:

          - Root credentials MinIO will not accept. It enforces access key
            >= 3 characters and secret key >= 8, and fatals with
            "Invalid credentials" otherwise. The playbook now checks the
            lengths up front, so this only bites if /etc/default/minio was
            written some other way.
          - No credentials at all: this release has NO minioadmin/minioadmin
            fallback, so if /etc/default/minio is missing or empty the server
            refuses to start. The unit reads it with
            `EnvironmentFile=-`, where the `-` means "carry on if absent".
          - {{ minio_data_dir }} not writable by minio-user, or SELinux
            denying it - `ausearch -m avc -ts recent` on the VM.
          - Port {{ minio_api_port }} already bound by something else.
  # The old version of this task just ran out of retries and reported
  # "Connection refused", which says nothing about why. The cause is always in
  # the unit's own log, so fetch it rather than making the next person go and
  # look.

- name: Set the local mc alias for this MinIO instance
  shell: >
    /usr/local/bin/mc alias set local
    http://127.0.0.1:{{ minio_api_port }}
    {{ minio_root_user }} {{ minio_root_password }}

- name: Create the OADP backup bucket if it doesn't already exist
  shell: >
    /usr/local/bin/mc ls local/{{ minio_bucket_name }} ||
    /usr/local/bin/mc mb local/{{ minio_bucket_name }}

- name: Report MinIO endpoint
  debug:
    msg: >-
      MinIO ready at http://{{ minio_domain }}:{{ minio_api_port }}
      (console: http://{{ minio_domain }}:{{ minio_console_port }}),
      bucket '{{ minio_bucket_name }}' created.
