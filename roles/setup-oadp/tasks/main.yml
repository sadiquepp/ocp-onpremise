---
# Tasks file for setup-oadp
#
# The OADP operator itself is installed as part of hub bring-up by
# roles/setup-hub-acm (alongside ACM/LVM-Storage/MetalLB), so it's
# already present on both hub1 and hub2 by the time this role runs.
#
# This role only handles the parts that need AWS credentials/a bucket
# to already exist, which isn't true the moment a hub is first created:
# the cloud-credentials secret and the DataProtectionApplication CR.
# Idempotent - safe to re-run against hub1 or hub2 with the same
# S3 bucket/prefix so it can see the existing backups.
#
# When oadp_backup_method=csi it additionally prepares the hub for CSI
# VolumeSnapshot backups (see csi-snapshot-class.yml). The DPA itself
# needs nothing extra: the csi plugin and the kopia node-agent it
# already enables are what the data mover uses either way.

- name: Wait for the OADP operator CRDs to be established
  shell: |
    oc wait --for=condition=Established crd/dataprotectionapplications.oadp.openshift.io --timeout=180s
  register: crd_wait
  retries: 3
  delay: 20
  until: crd_wait.rc == 0

- name: Render AWS credentials file for Velero
  template:
    src: credentials-adp.j2
    dest: "{{ role_path }}/templates/.rendered-credentials-adp"
    mode: '0600'

- name: Create/update the cloud-credentials secret (idempotent)
  shell: |
    oc create secret generic cloud-credentials -n openshift-adp \
      --from-file cloud="{{ role_path }}/templates/.rendered-credentials-adp" \
      --dry-run=client -o yaml | oc apply -f -

- name: Render DataProtectionApplication
  template:
    src: dpa.yaml.j2
    dest: "{{ role_path }}/templates/.rendered-dpa.yaml"

- name: Apply DataProtectionApplication
  shell: |
    oc apply -f "{{ role_path }}/templates/.rendered-dpa.yaml"

## Velero validates the location about once a minute, so a phase left
## over from an earlier run (e.g. Unavailable from a bad key) can linger
## after the secret is fixed - keep polling rather than fail on the
## first Unavailable. Whether it got there is enforced at the end of the
## role, after the rendered credentials file has been removed.
- name: Wait for the BackupStorageLocation to become Available (checked every 10s, up to 3 min)
  shell: |
    oc get backupstoragelocation.velero.io "{{ oadp_storage_location }}" -n openshift-adp \
      -o jsonpath='{.status.phase}'
  register: bsl_phase
  until: bsl_phase.stdout == 'Available'
  retries: 18
  delay: 10
  changed_when: false
  failed_when: false

- name: Read why the BackupStorageLocation is not Available
  shell: |
    oc get backupstoragelocation.velero.io "{{ oadp_storage_location }}" -n openshift-adp \
      -o jsonpath='{.status.message}'
  register: bsl_message
  changed_when: false
  failed_when: false
  when: bsl_phase.stdout != 'Available'

- name: Report BackupStorageLocation status
  debug:
    msg: "BackupStorageLocation {{ oadp_storage_location }} phase: {{ bsl_phase.stdout | default('', true) | trim or 'unknown' }}"

- name: Read the hypershift plugin image Velero runs
  shell: |
    oc get deploy velero -n openshift-adp \
      -o jsonpath='{.spec.template.spec.initContainers[?(@.name=="hypershift-oadp-plugin")].image}'
  register: hcp_plugin_image
  changed_when: false
  failed_when: false

- name: Report the hypershift plugin image
  debug:
    msg: >-
      hypershift plugin image: {{ hcp_plugin_image.stdout | default('unknown', true) }}
      {{ '(override from oadp_hypershift_plugin_image)' if oadp_hypershift_plugin_image | default('') | length > 0 else '(operator default)' }}

- name: Prepare the CSI VolumeSnapshotClass for Velero
  ansible.builtin.include_tasks: csi-snapshot-class.yml
  when: oadp_backup_method | default('fs') == 'csi'
  tags:
    - oadp-csi

- name: Clean up rendered scratch files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ role_path }}/templates/.rendered-credentials-adp"
    - "{{ role_path }}/templates/.rendered-dpa.yaml"

## Last, so a bad key still leaves no rendered credentials file behind.
## Without this the play used to finish green with Velero unable to
## reach the bucket, and the first sign was a failed backup.
- name: Fail if the BackupStorageLocation is not Available
  ansible.builtin.fail:
    msg: >-
      BackupStorageLocation '{{ oadp_storage_location }}' is
      '{{ bsl_phase.stdout | default('', true) | trim or 'not reporting a phase' }}',
      not 'Available', so Velero cannot reach s3://{{ oadp_bucket_name }}/{{ oadp_backup_prefix }}.
      Velero says: {{ bsl_message.stdout | default('', true) | trim or '(no message)' }}.
      InvalidAccessKeyId / SignatureDoesNotMatch: fix oadp_aws_access_key_id /
      oadp_aws_secret_access_key (ansible-vault edit vault.yaml).
      NoSuchBucket / AccessDenied / a region error: check oadp_bucket_name,
      oadp_aws_region and the IAM user's policy (oadp/README.md).
      Then re-run setup_oadp.yaml against this hub.
  when: bsl_phase.stdout != 'Available'
