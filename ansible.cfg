[defaults]
## Host key checking OFF, deliberately. Every guest in this lab is created,
## destroyed and recreated at the same address, so an unknown or changed key is
## routine - and a prompt in the middle of a playbook is a stalled run, not a
## safeguard. With this set, Ansible passes -o StrictHostKeyChecking=no itself,
## which also covers a host reached through delegate_to that is not in the
## inventory.
##
## This replaces `host_key_auto_add = True`, which never took effect: that key
## belongs to the [paramiko_connection] section (and is deprecated), so under
## [defaults] it was silently ignored - `ansible-config dump --only-changed`
## listed nothing and HOST_KEY_CHECKING stayed at its default True. The only
## thing suppressing the prompt was the per-host ansible_ssh_common_args in
## inventory/hosts, which does nothing for a host that is not in there.
host_key_checking = False

## The lab inventory, so that forgetting `-i inventory/hosts` cannot quietly
## run a playbook with no inventory at all.
##
## That matters most for the playbooks that run on localhost and delegate into
## a VM by address - setup_minio.yaml and setup_mirror_registry.yaml. A
## delegated host picks up ansible_ssh_private_key_file and
## ansible_ssh_common_args ONLY if its address matches an inventory host; with
## no inventory loaded it gets neither, and setup-rhsm's wait_for_connection
## then burns its full 300s timeout before failing with
## "Permission denied (publickey)" - having offered no key at all.
##
## An explicit -i on the command line still wins, so every documented
## invocation behaves exactly as before.
##
## Relative to the WORKING DIRECTORY, which is the repository root whenever
## this is the ansible.cfg Ansible reads.
inventory = inventory/hosts
