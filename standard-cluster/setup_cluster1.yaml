## Installs cluster1 - a standard OpenShift cluster on KVM/libvirt (UPI:
## bootstrap/master/worker VMs booted from RHCOS + ignition) - and, when
## use_lvm_storage is true, LVM Storage on it as its default StorageClass.
##
## Nothing else is installed on top. ACM/MCE, MetalLB and the OADP operator -
## what turns the cluster into a hosted-control-plane hub - are a separate
## step, run once this playbook has finished:
##   cd ../acm && ansible-playbook -i ../inventory/hosts setup_acm.yaml --ask-vault-pass
##
## Run from inside standard-cluster/ (standard-cluster/ansible.cfg is what puts
## the shared ../roles on the role search path).
##
## In variable names and target_hub values cluster1 is still called "hub":
## hub_install_folder, ip_list.hub_*, hub_domain, target_hub=hub.
##
## One playbook, two install modes, selected by disconnected_install
## (vars.yaml, default false) - the same flag the rest of the disconnected
## flow hangs off:
##
## Connected (default) - cluster1 (hub):
##   ansible-playbook -i ../inventory/hosts setup_cluster1.yaml --ask-vault-pass
## installs roles/setup-hub-cluster into hub_install_folder and pulls
## release/operator images from quay.io + registry.redhat.io.
##
## Disconnected - cluster1d (hubd):
##   ansible-playbook -i ../inventory/hosts setup_cluster1.yaml --ask-vault-pass \
##     -e disconnected_install=true
## installs roles/setup-hub-cluster-disconnected into
## hub_disconnected_install_folder instead, and the cluster is configured to
## pull every release/operator image solely from the local mirror registry
## (see ../setup_mirror_registry.yaml). It also cuts the cluster's own nodes off
## from the real internet first, so a "disconnected" install cannot quietly
## succeed for the wrong reason.
##
## LVM Storage (use_lvm_storage, default true) is installed by
## setup-lvm-storage as the last step of the build, tag lvm; --tags lvm adds
## just that to a cluster that is already up:
##   ansible-playbook -i ../inventory/hosts setup_cluster1.yaml --ask-vault-pass --tags lvm
## Set use_lvm_storage: false for the Ceph/ODF path (../ceph/README.md), where
## ODF wants openshift-storage to itself.
##
## The clusters CO-EXIST, with cluster2 (setup_cluster2.yaml) as well: the
## disconnected cluster1 has its own IP block (ip_list.hubd_*), its own
## subdomain (hub_disconnected_domain) and its own VM/install directories, so
## all of them can be running at the same time. Adding the hubd_* entries to
## ip_list is what gives it DHCP reservations and DNS records, so re-run
## ../setup_bm_host.yaml (at minimum its dns/lb tags) after pulling those vars
## in, otherwise api/api-int/*.apps for that cluster won't resolve.
##
## A disconnected run additionally requires the mirror registry to be stood up
## already via ../setup_mirror_registry.yaml (mirror registry CA trusted +
## credentials available locally, oc-mirror output present on the
## mirror-registry VM); the preflight below fails fast if it isn't.

- name: Setting Up Cluster1
  hosts: localhost
  become: true
  vars_files:
    - ../vars.yaml
    - ../vault.yaml
  vars:
    ## Every difference between the two modes is derived from this one flag,
    ## so the connected and disconnected runs differ in their inputs rather
    ## than in their steps. Play vars rather than a set_fact, so a --tags lvm
    ## run resolves them too.
    hub_disconnected: "{{ disconnected_install | default(false) | bool }}"
    ## hub_disconnected is a play var, so it reaches a task as the rendered
    ## template rather than a native bool - hence the '| bool' on every use,
    ## the same way the roles read disconnected_install itself.
    hub_install_folder_selected: >-
      {{ hub_disconnected_install_folder
         if (disconnected_install | default(false) | bool)
         else hub_install_folder }}
    hub_kubeconfig: "{{ hub_install_folder_selected }}/auth/kubeconfig"
  tasks:
  - name: Report which cluster1 is being installed
    ansible.builtin.debug:
      msg: >-
        {{ (hub_disconnected | bool) | ternary('Disconnected (hubd)', 'Connected (hub)') }}
        cluster1 install into {{ hub_install_folder_selected }}

  # Only the disconnected install has a prerequisite outside this playbook:
  # ../setup_mirror_registry.yaml has to have stood the registry up and run
  # setup-mirror-registry-trust here, or the install cannot pull anything.
  - name: Fail fast if the mirror registry CA has not been trusted locally yet
    ansible.builtin.stat:
      path: /etc/pki/ca-trust/source/anchors/mirror-registry-rootCA.pem
    register: mirror_ca_status
    when: hub_disconnected | bool

  - ansible.builtin.assert:
      that:
        - mirror_ca_status.stat.exists
      fail_msg: >-
        Mirror registry CA not found locally - run setup_mirror_registry.yaml
        (repository root) first: it stands up the mirror registry and runs
        setup-mirror-registry-trust to trust its CA here.
    when: hub_disconnected | bool

  - ansible.builtin.import_role:
      name: setup-hub-cluster
    when: not (hub_disconnected | bool)

  - ansible.builtin.import_role:
      name: setup-hub-cluster-disconnected
    when: hub_disconnected | bool

  # Both roles ship a byte-identical copy of this; cluster2 includes the same
  # one, so keep to that one file rather than branching on the mode here.
  # Relative to this playbook's directory, not the working directory.
  - name: Wait for ClusterOperators to be healthy before day-2 install
    ansible.builtin.include_tasks: ../roles/setup-hub-cluster/tasks/wait-for-cluster-operators.yml
    vars:
      kubeconfig_path: "{{ hub_kubeconfig }}"

  # The ImageDigestMirrorSet/ImageTagMirrorSet/CatalogSource oc-mirror generated
  # are applied here rather than dropped into the install manifests directory.
  # In manifests/ they are rendered into a MachineConfig by the in-cluster MCO,
  # which then has to match what the bootstrap MCO rendered from
  # install-config.yaml's imageDigestSources - and an ImageTagMirrorSet has no
  # imageDigestSources equivalent, so the two can never agree. Applied on day 2
  # they are an ordinary MachineConfig update instead. The install itself does
  # not need them: the installer generates its own ImageDigestMirrorSet from
  # imageDigestSources.
  - name: Apply the mirror registry's day-2 resources (IDMS/ITMS/CatalogSource)
    ansible.builtin.include_tasks: ../roles/setup-hub-cluster-disconnected/tasks/apply-day2-mirror-resources.yml
    vars:
      kubeconfig_path: "{{ hub_kubeconfig }}"
    when: hub_disconnected | bool

  # LVM Storage as part of the build: the cluster comes up with a default
  # StorageClass (lvms-vg1) on the workers' storage_worker<N>.qcow2 disks.
  # Off on the Ceph path (use_lvm_storage: false), where ODF wants
  # openshift-storage to itself. On a cluster that is already up, add it - and
  # nothing else - with:
  #   ansible-playbook -i ../inventory/hosts setup_cluster1.yaml --ask-vault-pass --tags lvm
  - ansible.builtin.import_role:
      name: setup-lvm-storage
    when: use_lvm_storage | bool
    environment:
      KUBECONFIG: "{{ hub_kubeconfig }}"
    tags:
      - lvm

  - name: Next step
    ansible.builtin.debug:
      msg: >-
        cluster1 is up ({{ hub_kubeconfig }}). To make it a hosted-control-plane
        hub, install ACM/MCE, MetalLB and the OADP operator with
        'cd ../acm && ansible-playbook -i ../inventory/hosts setup_acm.yaml --ask-vault-pass'.
