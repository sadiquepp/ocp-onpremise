## Tear the lab down.
##
##   ansible-playbook -i inventory/hosts cleanup.yaml
##
## Everything here is idempotent and safe to run against a partially-built
## lab: a missing domain or a missing disk is not an error. Run it with no
## tags to remove everything, or narrow it to one or more pieces with
## --tags a,b:
##
##   --tags hub      hub1 - VMs, VM folder and install folder
##   --tags hub2     the DR hub (setup_hub_cluster2.yaml), the same way
##   --tags hubd     the disconnected hub (setup_hub_cluster.yaml
##                   -e disconnected_install=true) - VMs, folders, staged
##                   oc-mirror manifests and its egress-blocking iptables rules
##   --tags hub2d    the disconnected DR hub, the same way
##   --tags hosted   the hosted clusters' worker VMs (c1 and c1-d)
##   --tags helper   the helper VM
##   --tags registry shut the mirror registry down (see below - it is kept)
##   --tags minio    the MinIO VM
##   --tags ceph     the Ceph VMs and their OSD disks - also the DR demo's
##                   deliberate storage-loss step
##   --tags sno      the single-node OpenShift cluster only
##   --tags sno2     the second single-node cluster (setup_sno2.yaml) only
##   --tags compact  the three-node compact cluster only, with the worker VMs
##                   of the hosted cluster it manages (hcp-compact1)
##   --tags compacthcp  just those hosted cluster worker VMs and their cached
##                   discovery ISO - the compact cluster stays
##   --tags compactd the disconnected compact cluster only (VMs, folders and
##                   its egress-blocking iptables rules)
##   --tags udnlab   the UDN/BGP/EVPN lab - clab VM, client VMs, fabric net
##
## Every tag leaves the others' VMs alone: hub, hub2, hubd and hub2d are
## namespaced apart, so removing one never touches another. /root/.ssh/known_hosts
## is cleared on every run, whatever the tags, since a rebuilt VM comes back on
## the same address with a new host key.
##
## THE MIRROR REGISTRY IS ONLY SHUT DOWN, never deleted, by a plain run. Its VM,
## its 500G disk and everything oc-mirror put on it survive, so the
## disconnected flows can be picked up again with `virsh start registry`
## instead of another mirror run over tens of gigabytes. The CA this host
## trusts and its podman login are left alone too, since they still match that
## registry.
##
##   ansible-playbook -i inventory/hosts cleanup.yaml --tags registry-destroy
##
## is the one that really removes it - the VM, the disks and, unless told
## otherwise, the local trust that would otherwise outlive it. It is tagged
## `never`, so no run that does not name it can reach it - not even
## `--tags all`. See the second play below.
##
## WHAT THIS DOES NOT TOUCH. The DHCP reservations these VMs hold on the
## libvirt 'default' network are left in place. Every MAC in this lab is
## derived from ip_list in vars.yaml, so a rebuild reuses the same MAC and the
## setup roles skip re-adding a reservation that is already there. Deleting
## them would be churn with a failure mode (a half-removed <host> entry) and
## no benefit.
##
## HOW A VM IS REMOVED. roles/cleanup-vms does it for most of the clusters
## below: destroy, then undefine, tolerating both failing, then delete its
## disks and folders. Its tasks say why that order and no other. It is pulled
## in with import_role, not include_role, so the tags on each call reach the
## role's tasks.
- name: Cleanup
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
  tasks:
  ## The install folders go with the VMs: each holds auth/kubeconfig - the
  ## only copy of the credentials for a cluster that no longer exists - plus
  ## the agent ISO its domain booted from. A stale kubeconfig left on this
  ## host is what setup_udn_bgp_lab.yaml's pre-flight exists to catch, because
  ## an `oc` that silently falls through to the WRONG cluster looks exactly
  ## like a working run.
  ##
  ## The VM folders hold every disk of the cluster, its storage workers'
  ## included, and anything else in there belongs to the cluster being
  ## removed. The setup roles recreate both on a fresh install, so this costs
  ## nothing.
  - name: Destroy hub1
    tags: [hub]
    ansible.builtin.import_role:
      name: cleanup-vms
    vars:
      cleanup_vms_name: hub1
      cleanup_vms_domains: [hub_bootstrap, hub_master1, hub_master2, hub_master3,
                            hub_worker1, hub_worker2, hub_worker3]
      cleanup_vms_paths:
        - "{{ hub_vm_folder }}"
        - "{{ hub_install_folder }}"

  - name: Destroy hub2
    tags: [hub2]
    ansible.builtin.import_role:
      name: cleanup-vms
    vars:
      cleanup_vms_name: hub2
      cleanup_vms_domains: [hub2_bootstrap, hub2_master1, hub2_master2, hub2_master3,
                            hub2_worker1, hub2_worker2, hub2_worker3]
      cleanup_vms_paths:
        - "{{ hub2_vm_folder }}"
        - "{{ hub2_install_folder }}"

  ## The disconnected hubs also leave behind the oc-mirror cluster-resources
  ## manifests staged on this host, which describe the mirror as it was at
  ## install time, and the iptables rules that cut their nodes off from the
  ## internet. Both go: each build re-fetches the manifests, and stale rules
  ## would cut off whatever next takes the same addresses.
  - name: Destroy the disconnected hub (hubd)
    tags: [hubd]
    ansible.builtin.import_role:
      name: cleanup-vms
    vars:
      cleanup_vms_name: hubd
      cleanup_vms_domains: [hubd_bootstrap, hubd_master1, hubd_master2, hubd_master3,
                            hubd_worker1, hubd_worker2, hubd_worker3]
      cleanup_vms_paths:
        - "{{ hub_disconnected_vm_folder }}"
        - "{{ hub_disconnected_install_folder }}"
        - "{{ hub_disconnected_cluster_resources_dir | default('/tmp/hubd-cluster-resources') }}"
        - "{{ hub_disconnected_cluster_resources_archive | default('/tmp/hubd-cluster-resources.tar.gz') }}"
      cleanup_vms_nat_label: "{{ hub_disconnected_name | default('hubd') }}"

  - name: Destroy the disconnected DR hub (hub2d)
    tags: [hub2d]
    ansible.builtin.import_role:
      name: cleanup-vms
    vars:
      cleanup_vms_name: hub2d
      cleanup_vms_domains: [hub2d_bootstrap, hub2d_master1, hub2d_master2, hub2d_master3,
                            hub2d_worker1, hub2d_worker2, hub2d_worker3]
      cleanup_vms_paths:
        - "{{ hub2_disconnected_vm_folder }}"
        - "{{ hub2_disconnected_install_folder }}"
        - "{{ hub2_disconnected_cluster_resources_dir | default('/tmp/hub2d-cluster-resources') }}"
        - "{{ hub2_disconnected_cluster_resources_archive | default('/tmp/hub2d-cluster-resources.tar.gz') }}"
      cleanup_vms_nat_label: "{{ hub2_disconnected_name | default('hub2d') }}"

  - name: Destroy the hosted cluster workers
    tags: [hosted]
    ansible.builtin.import_role:
      name: cleanup-vms
    vars:
      cleanup_vms_name: hosted cluster c1
      cleanup_vms_domains: [c1_worker1, c1_worker2, c1_worker3]
      cleanup_vms_paths:
        - /var/lib/libvirt/images/hosted_cluster/c1_worker1.qcow2
        - /var/lib/libvirt/images/hosted_cluster/c1_worker2.qcow2
        - /var/lib/libvirt/images/hosted_cluster/c1_worker3.qcow2

  - name: Destroy the disconnected hosted cluster workers
    tags: [hosted]
    ansible.builtin.import_role:
      name: cleanup-vms
    vars:
      cleanup_vms_name: hosted cluster c1-d
      cleanup_vms_domains: [c1-d-worker1, c1-d-worker2, c1-d-worker3]
      cleanup_vms_paths:
        - /var/lib/libvirt/images/hosted_cluster_disconnected/c1-d-worker1.qcow2
        - /var/lib/libvirt/images/hosted_cluster_disconnected/c1-d-worker2.qcow2
        - /var/lib/libvirt/images/hosted_cluster_disconnected/c1-d-worker3.qcow2

  - name: Destroy the helper VM
    tags: [helper]
    ansible.builtin.import_role:
      name: cleanup-vms
    vars:
      cleanup_vms_name: helper
      cleanup_vms_domains: [helper]
      cleanup_vms_paths: [/var/lib/libvirt/images/helper_disk.qcow2]

  ## The mirror registry is the one VM here that is kept. Everything else in
  ## this lab is rebuilt from a playbook in minutes; the registry's content is
  ## an oc-mirror run of tens of gigabytes, and nothing about it is tied to the
  ## clusters that were just removed. So it is stopped - freeing its 16G of
  ## RAM, which is the actual reason to care while it is not in use - and left
  ## defined, with its disks and its mirrored content intact.
  ##
  ## `virsh start registry` brings it back, and the disconnected playbooks work
  ## again with no mirror run: this host's CA trust and podman login are
  ## untouched here, and the registry comes up with the same name, address and
  ## certificate. To really remove it, run with --tags registry-destroy.
  ##
  ## Graceful first (quay stops cleanly, so a restart has no recovery to do),
  ## with a forced power-off only if it does not stop in three minutes. A
  ## domain that is absent or already off is left as it is.
  - name: Check the mirror registry VM's state
    tags: [registry]
    shell: "virsh domstate {{ mirror_registry_name | default('registry') }} 2>/dev/null || true"
    register: mirror_registry_state
    changed_when: false

  ## 'running', but also 'paused' or 'pmsuspended' - anything holding its
  ## memory. Absent is '' and gives nothing to do.
  - name: Note whether it is up
    tags: [registry]
    ansible.builtin.set_fact:
      mirror_registry_up: "{{ mirror_registry_state.stdout | trim not in ['', 'shut off'] }}"

  - name: Ask the mirror registry VM to shut down
    tags: [registry]
    shell: "virsh shutdown {{ mirror_registry_name | default('registry') }}"
    when: mirror_registry_up | bool

  - name: Wait for it to stop (up to 3 minutes)
    tags: [registry]
    shell: "virsh domstate {{ mirror_registry_name | default('registry') }} 2>/dev/null || true"
    register: mirror_registry_stopping
    until: "'shut off' in mirror_registry_stopping.stdout"
    retries: 18
    delay: 10
    failed_when: false
    changed_when: false
    when: mirror_registry_up | bool

  ## Only if the guest ignored ACPI. The registry holds no state that a hard
  ## power-off endangers - quay's data is on the disk and its database is
  ## crash-safe - so this is a last resort, not a risk.
  - name: Force it off if the graceful shutdown did not finish
    tags: [registry]
    shell: "virsh destroy {{ mirror_registry_name | default('registry') }} >/dev/null 2>&1 || true"
    when:
      - mirror_registry_up | bool
      - "'shut off' not in (mirror_registry_stopping.stdout | default(''))"

  - name: Report what happened to the mirror registry
    tags: [registry]
    ansible.builtin.debug:
      msg: >-
        {{ mirror_registry_name | default('registry') }}:
        {{ 'was ' ~ (mirror_registry_state.stdout | trim) ~ ', now shut off - VM and mirrored content kept.'
           if (mirror_registry_up | bool)
           else ((mirror_registry_state.stdout | trim | length > 0)
                 | ternary('already shut off - VM and mirrored content kept.',
                           'not defined, nothing to do.')) }}
        Start it again with: virsh start {{ mirror_registry_name | default('registry') }}
        - or remove it for good with: cleanup.yaml --tags registry-destroy

  - name: Destroy the MinIO VM
    tags: [minio]
    ansible.builtin.import_role:
      name: cleanup-vms
    vars:
      cleanup_vms_name: minio
      cleanup_vms_domains: [minio]
      cleanup_vms_paths: [/var/lib/libvirt/images/minio_disk.qcow2]

  - name: Destroy the Ceph VMs and their OSD disks
    tags: [ceph]
    ansible.builtin.import_role:
      name: cleanup-vms
    vars:
      cleanup_vms_name: ceph
      cleanup_vms_domains: [ceph1, ceph2, ceph3, cephadmin]
      cleanup_vms_paths:
        - /var/lib/libvirt/images/ceph1_disk.qcow2
        - /var/lib/libvirt/images/ceph2_disk.qcow2
        - /var/lib/libvirt/images/ceph3_disk.qcow2
        - /var/lib/libvirt/images/cephadmin_disk.qcow2
        - /var/lib/libvirt/images/ceph1_osd1.qcow2
        - /var/lib/libvirt/images/ceph1_osd2.qcow2
        - /var/lib/libvirt/images/ceph1_osd3.qcow2
        - /var/lib/libvirt/images/ceph2_osd1.qcow2
        - /var/lib/libvirt/images/ceph2_osd2.qcow2
        - /var/lib/libvirt/images/ceph2_osd3.qcow2
        - /var/lib/libvirt/images/ceph3_osd1.qcow2
        - /var/lib/libvirt/images/ceph3_osd2.qcow2
        - /var/lib/libvirt/images/ceph3_osd3.qcow2

  ## -------------------------------------------------------------------------
  ## The single-node OpenShift cluster (setup_sno.yaml)
  ## -------------------------------------------------------------------------
  ## The install folder goes with the VM, deliberately. It holds the agent ISO
  ## the domain boots from AND auth/kubeconfig - the only copy of the
  ## credentials for a cluster that no longer exists. Leaving it behind is
  ## worse than removing it: setup-sno wipes and rebuilds the folder on a fresh
  ## install anyway, and a stale kubeconfig on this host is exactly what
  ## setup_udn_bgp_lab.yaml's pre-flight exists to catch, because an `oc` that
  ## silently falls through to the WRONG cluster looks like a working run.
  - name: Destroy the single-node OpenShift VM
    tags: [sno]
    shell: |
      virsh destroy  {{ sno_name }} >/dev/null 2>&1 || true
      virsh undefine {{ sno_name }} --remove-all-storage >/dev/null 2>&1 || \
        virsh undefine {{ sno_name }} >/dev/null 2>&1 || true
      rm -rf {{ sno_vm_folder | default(download_dir ~ '/' ~ sno_name) }}
      rm -rf {{ sno_install_folder }}

  ## sno2 (setup_sno2.yaml, sno2_enabled), the same way and for the same
  ## reasons. Not conditional on sno2_enabled: a sno2 left behind after the
  ## flag was turned off is exactly what this has to find.
  - name: Destroy the second single-node OpenShift VM (sno2)
    tags: [sno2]
    shell: |
      virsh destroy  sno2 >/dev/null 2>&1 || true
      virsh undefine sno2 --remove-all-storage >/dev/null 2>&1 || \
        virsh undefine sno2 >/dev/null 2>&1 || true
      rm -rf {{ sno2_vm_folder | default(download_dir ~ '/sno2') }}
      rm -rf {{ sno2_install_folder | default(download_dir ~ '/sno2_install') }}

  ## -------------------------------------------------------------------------
  ## The three-node compact cluster (compact-cluster/setup_compact_cluster.yaml)
  ## -------------------------------------------------------------------------
  ## Same reasoning as the SNO above for taking the install folder with it.
  ## No --remove-all-storage: the three domains share the agent ISO as their
  ## cdrom, and the folders are removed outright below anyway.
  - name: Destroy the compact cluster VMs
    tags: [compact]
    shell: |
      {% for node in compact_nodes | default([]) %}
      virsh destroy  {{ node.ip_key }} >/dev/null 2>&1 || true
      virsh undefine {{ node.ip_key }} >/dev/null 2>&1 || true
      {% endfor %}
      rm -rf {{ compact_vm_folder | default(download_dir ~ '/compact') }}
      rm -rf {{ compact_install_folder | default(download_dir ~ '/compact_install') }}

  ## The worker VMs of the hosted cluster the compact cluster manages
  ## (setup_hosted_cluster_vm.yaml -e target_hub=compact). Its control plane is
  ## pods on the compact cluster, so it goes with it; --tags compacthcp removes
  ## only the workers, e.g. to rebuild them. To retire the hosted cluster
  ## while keeping the compact cluster, delete its HostedCluster/NodePool on
  ## the compact cluster first (compact-cluster/compact-cluster-hcp.md), or
  ## the NodePool keeps waiting for Agents that no longer exist.
  - name: Destroy the compact cluster's hosted cluster worker VMs
    tags: [compact, compacthcp]
    shell: |
      {% for w in compact_hosted_cluster_workers | default([]) %}
      virsh destroy  {{ w.name }} >/dev/null 2>&1 || true
      virsh undefine {{ w.name }} >/dev/null 2>&1 || true
      {% endfor %}
      rm -rf {{ compact_hosted_cluster_vm_folder | default(download_dir ~ '/hcp_compact1') }}
      rm -f {{ download_dir }}/compact-bminfra-discovery-*

  ## -------------------------------------------------------------------------
  ## The disconnected compact cluster (compact-cluster/setup_compact_cluster_disconnected.yaml)
  ## -------------------------------------------------------------------------
  ## Its iptables rules go too. They carry the comment
  ## "compactd disconnected: ..." (block-node-nat.yml), so only this cluster's
  ## rules are deleted; hubd's, and the LAB_NO_NAT / LAB_NO_EGRESS chains and
  ## their jumps, stay for whoever else uses them. The mirror registry and the
  ## chronyd `allow` on this host are shared infrastructure and are left alone.
  - name: Destroy the disconnected compact cluster VMs
    tags: [compactd]
    shell: |
      {% for node in compactd_nodes | default([]) %}
      virsh destroy  {{ node.ip_key }} >/dev/null 2>&1 || true
      virsh undefine {{ node.ip_key }} >/dev/null 2>&1 || true
      {% endfor %}
      rm -rf {{ compactd_vm_folder | default(download_dir ~ '/compactd') }}
      rm -rf {{ compactd_install_folder | default(download_dir ~ '/compactd_install') }}
      rm -rf /tmp/{{ compactd_name | default('compactd') }}-cluster-resources /tmp/{{ compactd_name | default('compactd') }}-cluster-resources.tar.gz

  - name: Remove the disconnected compact cluster's egress-blocking rules
    tags: [compactd]
    shell: |
      for t in "nat LAB_NO_NAT" "filter LAB_NO_EGRESS"; do
        set -- $t
        iptables -t $1 -S $2 2>/dev/null \
          | grep -- '--comment "{{ compactd_name | default('compactd') }} disconnected:' \
          | sed 's/^-A /-D /' \
          | while read -r rule; do eval iptables -t $1 $rule; done
      done
      true

  ## -------------------------------------------------------------------------
  ## The UDN/BGP/EVPN lab (setup_udn_bgp_lab.yaml)
  ## -------------------------------------------------------------------------
  ## Names come from vars.yaml rather than being spelled out, so adding a
  ## tenant client there does not leave an orphan VM here. udn_tenant_clients
  ## is the same list tenant-client-vms.yml builds from.
  - name: Destroy the UDN lab client VMs
    tags: [udnlab]
    shell: |
      for d in {{ ([udn_client_vm_name, udn_nsclient_vm_name]
                   + (udn_tenant_clients | map(attribute='name') | list))
                  | join(' ') }}; do
        virsh destroy  "$d" >/dev/null 2>&1 || true
        virsh undefine "$d" >/dev/null 2>&1 || true
        rm -f "{{ download_dir | regex_replace('/+$', '') }}/${d}_disk.qcow2"
      done

  ## In vm mode the routers live inside this VM, so destroying it destroys the
  ## fabric. The lab directory ({{ clab_lab_dir }}) goes with it.
  - name: Destroy the containerlab VM
    tags: [udnlab]
    shell: |
      virsh destroy  {{ clab_vm_name }} >/dev/null 2>&1 || true
      virsh undefine {{ clab_vm_name }} >/dev/null 2>&1 || true
      rm -f {{ download_dir | regex_replace('/+$', '') }}/{{ clab_vm_disk }}

  ## In host mode there is no VM to destroy and the containers are running on
  ## THIS machine, holding veths into {{ clab_fabric_bridge }}. containerlab
  ## has to remove them or the next deploy inherits half a fabric. Guarded on
  ## the binary existing, so this is a no-op in vm mode.
  - name: Destroy the containerlab topology if it runs on this host
    tags: [udnlab]
    shell: |
      command -v containerlab >/dev/null 2>&1 || exit 0
      [ -f {{ clab_lab_dir }}/{{ clab_lab_name }}.clab.yml ] || exit 0
      containerlab destroy -t {{ clab_lab_dir }}/{{ clab_lab_name }}.clab.yml --cleanup || true
      rm -rf {{ clab_lab_dir }}

  ## The further segments' leaves (clab_fabric_segments - rack2's leaf3), each
  ## its own containerlab lab in <clab_lab_dir>-<segment>. Same reasoning as
  ## above: a no-op in vm mode, where they went with the VM.
  - name: Destroy the rack leaves' topologies if they run on this host
    tags: [udnlab]
    shell: |
      command -v containerlab >/dev/null 2>&1 || exit 0
      {% for seg in (clab_fabric_segments | default({})) %}
      if [ -f {{ clab_lab_dir }}-{{ seg }}/{{ clab_lab_name }}-{{ seg }}.clab.yml ]; then
        containerlab destroy -t {{ clab_lab_dir }}-{{ seg }}/{{ clab_lab_name }}-{{ seg }}.clab.yml --cleanup || true
      fi
      rm -rf {{ clab_lab_dir }}-{{ seg }}
      {% endfor %}
      exit 0

  ## Last, because the VMs above have interfaces on it and libvirt will not
  ## destroy a network that is still in use. <forward mode='none'> - it carries
  ## nothing but the fabric, so removing it cannot affect virbr0 or the lab's
  ## egress.
  - name: Remove the containerlab fabric network
    tags: [udnlab]
    shell: |
      virsh net-destroy  {{ clab_fabric_network }} >/dev/null 2>&1 || true
      virsh net-undefine {{ clab_fabric_network }} >/dev/null 2>&1 || true
      {% for seg in (clab_fabric_segments | default({})).values() %}
      virsh net-destroy  {{ seg.network }} >/dev/null 2>&1 || true
      virsh net-undefine {{ seg.network }} >/dev/null 2>&1 || true
      {% endfor %}
      exit 0

  ## Rendered per-cluster manifests, which name pod addresses that will not
  ## exist after this run. Harmless to keep, but they are the thing most likely
  ## to be re-applied by hand against a rebuilt cluster.
  - name: Remove the rendered UDN manifests
    tags: [udnlab]
    ansible.builtin.file:
      path: "{{ playbook_dir }}/udn-bgp-evpn/udn-bgp"
      state: absent

  - name: Clear root's SSH known_hosts
    tags: [always]
    shell: |
      rm -f /root/.ssh/known_hosts

## ===========================================================================
## Remove the mirror registry for good: the VM, its disks, and the trust this
## host holds for it.
##
##   ansible-playbook -i inventory/hosts cleanup.yaml --tags registry-destroy
##
## This is the counterpart to the play above, which deliberately only SHUTS the
## registry DOWN. Rebuilding it costs an oc-mirror run of tens of gigabytes, so
## tearing the lab's clusters down leaves it stopped and intact; this play is
## the explicit "I am done with it" step, and it is tagged `never` so that
## nothing short of naming it runs it.
##
## WHAT GOES:
##   - the registry VM (destroyed and undefined)
##   - its root disk and its extra disk, with every mirrored image on them
##   - this host's trust in it: the CA in /etc/pki/ca-trust/source/anchors and
##     the podman login entry in mirror_registry_authfile
##
## The trust goes by default because a rebuilt registry generates a NEW CA, and
## a stale one is worse than none: it is what roles/setup-compact-cluster and
## setup_hub_cluster.yaml check to decide the mirror registry "has been set up",
## so leaving it behind makes a disconnected run start and then fail on a TLS
## error instead of stopping with a clear message. Keep it with:
##
##   -e mirror_registry_remove_local_trust=false
##
## Only the mirror registry's own entry is removed from the authfile
## (podman logout, not rm): mirror_registry_authfile defaults to
## /root/.docker/config.json, which also holds your quay.io and
## registry.redhat.io credentials.
##
## WHAT STAYS: everything else. The DHCP reservation and DNS record for the
## registry's address come from ip_list in vars.yaml, like every other VM's,
## and a rebuild reuses them - the same reasoning as the play above. Clusters
## already installed from this registry keep running; they only break when
## they next need to pull an image.
##
## Re-create it with:
##   ansible-playbook -i inventory/hosts setup_mirror_registry.yaml \
##     -e disconnected_install=true --ask-vault-pass
- name: Remove the mirror registry
  hosts: localhost
  become: true
  tags: [never, registry-destroy]
  vars_files:
    - vars.yaml
  vars:
    ## Also remove the CA this host trusts and the podman login for the
    ## registry. See the note above before turning this off.
    mirror_registry_remove_local_trust: true
  tasks:
  - name: Report what is about to be removed
    ansible.builtin.debug:
      msg: >-
        Removing the mirror registry VM '{{ mirror_registry_name }}'
        ({{ mirror_registry_domain }}:{{ mirror_registry_port }}), its disks
        and every mirrored image on them.
        Local CA trust and podman login:
        {{ (mirror_registry_remove_local_trust | bool) | ternary('also removed', 'kept') }}.

  ## Destroy before undefine, and tolerate both failing - the same sequence and
  ## for the same reason as roles/cleanup-vms: undefining a running domain makes it
  ## transient rather than stopping it, and destroying one that is already off
  ## fails.
  - name: Destroy and undefine the mirror registry VM
    shell: |
      virsh destroy  {{ mirror_registry_name }} >/dev/null 2>&1 || true
      virsh undefine {{ mirror_registry_name }} >/dev/null 2>&1 || true

  - name: Delete its disks
    ansible.builtin.file:
      path: "/var/lib/libvirt/images/{{ item }}"
      state: absent
    loop:
      - "{{ mirror_registry_disk }}"
      - "{{ mirror_registry_extra_disk }}"

  ## The registry's own copy of these lives on the disk just deleted; this is
  ## the hypervisor's side of it, left by roles/setup-mirror-registry-trust.
  - name: Log podman out of the mirror registry
    shell: >-
      podman logout --authfile {{ mirror_registry_authfile }}
      {{ mirror_registry_domain }}:{{ mirror_registry_port }}
    register: mirror_registry_logout
    failed_when: false
    changed_when: "'Removed login credentials' in mirror_registry_logout.stdout"
    when: mirror_registry_remove_local_trust | bool

  - name: Remove the mirror registry CA from this host's trust anchors
    ansible.builtin.file:
      path: /etc/pki/ca-trust/source/anchors/mirror-registry-rootCA.pem
      state: absent
    register: mirror_registry_ca
    when: mirror_registry_remove_local_trust | bool

  - name: Rebuild the CA trust bundle
    ansible.builtin.command:
      cmd: update-ca-trust extract
    when:
      - mirror_registry_remove_local_trust | bool
      - mirror_registry_ca is changed

  ## Staged copies of what oc-mirror published, pulled off the registry VM by
  ## the disconnected cluster builds. They describe a registry that no longer
  ## exists, and each build re-fetches them anyway.
  - name: Remove the staged oc-mirror cluster-resources on this host
    ansible.builtin.file:
      path: "{{ item }}"
      state: absent
    loop:
      - "{{ hub_disconnected_cluster_resources_dir | default('/tmp/hubd-cluster-resources') }}"
      - "{{ hub_disconnected_cluster_resources_archive | default('/tmp/hubd-cluster-resources.tar.gz') }}"
      - "{{ hub2_disconnected_cluster_resources_dir | default('/tmp/hub2d-cluster-resources') }}"
      - "{{ hub2_disconnected_cluster_resources_archive | default('/tmp/hub2d-cluster-resources.tar.gz') }}"
      - "/tmp/{{ compactd_name | default('compactd') }}-cluster-resources"
      - "/tmp/{{ compactd_name | default('compactd') }}-cluster-resources.tar.gz"

  - name: Report
    ansible.builtin.debug:
      msg: >-
        {{ mirror_registry_name }} is gone, with its disks and everything
        mirrored onto them.
        {{ 'The CA and podman login for it were removed from this host too.'
           if (mirror_registry_remove_local_trust | bool)
           else 'The CA and podman login for it were kept, and now point at a registry that no longer exists.' }}
        Rebuild it with: ansible-playbook -i inventory/hosts
        setup_mirror_registry.yaml -e disconnected_install=true --ask-vault-pass
